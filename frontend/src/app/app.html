<div class="dashboard-container" [class.no-sidebar]="!(authService.isLoggedIn$ | async)">
  <!-- Sidebar -->
  <aside class="sidebar" *ngIf="authService.isLoggedIn$ | async">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
        <span class="brand-name">APRA<span>Scaler</span></span>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-label">Main Menu</div>
      <a routerLink="/forecast" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        </span>
        Live Forecast
      </a>
      <a routerLink="/backtest" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        </span>
        Backtest
      </a>
      <a routerLink="/training" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <path d="M9 22v-2"/><path d="M15 22v-2"/><path d="M9 4V2"/><path d="M15 4V2"/>
            <path d="M22 9h-2"/><path d="M22 15h-2"/><path d="M4 9H2"/><path d="M4 15H2"/>
            <path d="M9 9h6v6H9z"/>
          </svg>
        </span>
        Training
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <a href="javascript:void(0)" (click)="authService.logout()" class="nav-item logout-btn" style="color: #ef4444; margin-bottom: 1rem;">
        <span class="nav-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </span>
        Logout
      </a>
      <div class="version">v1.2.0</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <section class="content-area">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
